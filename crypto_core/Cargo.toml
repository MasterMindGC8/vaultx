[package]
name = "crypto_core"
version = "0.1.0"
edition = "2024"

[lib]
# rlib for Rust-side tests/consumers, cdylib for the Flutter/Dart FFI bridge
# (see src/ffi.rs and client_app/lib/bridge/native_crypto.dart).
crate-type = ["rlib", "cdylib"]

[dependencies]
argon2 = { version = "0.5.3", features = ["std", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
ml-kem = { version = "0.3.2", features = ["getrandom", "zeroize"] }
openmls = "0.8.1"
openmls_basic_credential = "0.5.0"
openmls_memory_storage = "0.5.0"
openmls_rust_crypto = "0.5.1"
openmls_traits = "0.5.0"
redb = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2.0.20"
x25519-dalek = { version = "3.0.0", features = ["getrandom", "static_secrets"] }
zeroize = { version = "1.9.0", features = ["derive"] }
