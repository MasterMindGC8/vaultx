name: client_app
description: "Vault X — zero-knowledge, post-quantum encrypted messenger. Matrix terminal client."
publish_to: 'none'

version: 1.4.0+7

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # dart:ffi bindings to crypto_core's cdylib (see lib/bridge/native_crypto.dart).
  ffi: ^2.1.3
  flutter_shaders: ^0.1.3
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  package_info_plus: ^9.0.1
  path_provider: ^2.1.5
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  shaders:
    - assets/shaders/crt.frag

  # Platform-specific compiled crypto_core library, extracted to a real
  # file at startup on macOS/Linux (see bridge/native_crypto.dart) rather
  # than wired into the Xcode project / CMake install rules, which can't be
  # edited-and-verified without owning those machines. CI replaces these
  # placeholders with the real build output for each platform before
  # running `flutter build` — see .github/workflows/release.yml.
  assets:
    - assets/native/crypto_core.dylib
    - assets/native/crypto_core.so

  fonts:
    - family: Fira Code
      fonts:
        - asset: assets/fonts/FiraCode-Regular.ttf
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
